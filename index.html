<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نُظم | نظام المحاسبة والإدارة المالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy-950:#0B1526;
  --navy-900:#0F1F35;
  --navy-800:#152C48;
  --navy-700:#1E3A5F;
  --gold:#C6A15B;
  --gold-soft:#E8D9B8;
  --paper:#F3F5F8;
  --card:#FFFFFF;
  --line:#E2E6ED;
  --ink:#111826;
  --ink-soft:#5B6472;
  --green:#1E8E5A;
  --green-bg:#E7F5EE;
  --red:#C1443A;
  --red-bg:#FBEBEA;
  --amber:#B8790B;
  --amber-bg:#FCF1DE;
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'IBM Plex Sans Arabic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  min-height:100vh;
  font-size:14.5px;
}
.figure, .num, table td.num-cell{
  font-family:'IBM Plex Mono','IBM Plex Sans Arabic',sans-serif;
  direction:ltr;
  unicode-bidi:plaintext;
}
::selection{background:var(--gold-soft);}

/* ===== Sidebar ===== */
.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--navy-950);
  color:#CBD5E2;
  display:flex;
  flex-direction:column;
  height:100vh;
  position:sticky;
  top:0;
}
.brand{
  padding:22px 20px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand-mark{
  width:34px;height:34px;border-radius:8px;
  background:linear-gradient(155deg,var(--gold),#8f7130);
  display:flex;align-items:center;justify-content:center;
  color:var(--navy-950);font-weight:700;font-size:15px;
  font-family:'IBM Plex Mono';
}
.brand-text b{display:block;color:#fff;font-size:15.5px;font-weight:700;}
.brand-text span{display:block;font-size:11px;color:#8194AC;margin-top:1px;}

.nav{flex:1;overflow-y:auto;padding:10px 10px 14px;}
.nav-group-label{
  font-size:11px;color:#5E7192;padding:14px 10px 6px;letter-spacing:.2px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:8px;cursor:pointer;
  color:#B7C4D6;font-size:13.5px;font-weight:500;
  transition:background .15s;
  position:relative;
}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:var(--navy-700);color:#fff;}
.nav-item.active::before{
  content:"";position:absolute;right:-10px;top:8px;bottom:8px;width:3px;
  background:var(--gold);border-radius:3px;
}
.nav-item .ico{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;color:#7C8FA9;
}
.nav-item.active .ico, .nav-item:hover .ico{color:var(--gold);}
.nav-item .badge{
  margin-inline-start:auto;background:var(--red);color:#fff;font-size:10.5px;
  font-family:'IBM Plex Mono';padding:1px 6px;border-radius:20px;
}
.sidebar-foot{
  padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);
  font-size:11px;color:#5E7192;
}

/* ===== Main ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;position:sticky;top:0;z-index:5;
}
.topbar-title{font-size:16px;font-weight:700;}
.topbar-title span{display:block;font-size:11.5px;font-weight:400;color:var(--ink-soft);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:16px;}
.search-box{
  display:flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;width:230px;color:var(--ink-soft);font-size:12.5px;
}
.tb-icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);cursor:pointer;position:relative;
}
.tb-icon-btn .dot{position:absolute;top:6px;left:6px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--card);}
.user-chip{display:flex;align-items:center;gap:9px;padding-inline-start:14px;border-inline-start:1px solid var(--line);}
.avatar{width:32px;height:32px;border-radius:8px;background:var(--navy-800);color:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}
.user-chip .u b{display:block;font-size:12.5px;}
.user-chip .u span{font-size:11px;color:var(--ink-soft);}

.content{padding:24px;flex:1;}
.section{display:none;animation:fade .25s ease;}
.section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
.page-head h1{font-size:19px;font-weight:700;}
.page-head p{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.btn{
  border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;
}
.btn-primary{background:var(--navy-900);color:#fff;}
.btn-primary:hover{background:var(--navy-800);}
.btn-gold{background:var(--gold);color:var(--navy-950);}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn-row{display:flex;gap:8px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;position:relative;overflow:hidden;}
.kpi .label{font-size:12px;color:var(--ink-soft);margin-bottom:8px;}
.kpi .value{font-size:20px;font-weight:700;font-family:'IBM Plex Mono';direction:ltr;text-align:right;}
.kpi .delta{font-size:11px;margin-top:6px;display:flex;align-items:center;gap:4px;}
.kpi .delta.up{color:var(--green);}
.kpi .delta.down{color:var(--red);}
.kpi .accent{position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;}
.kpi.c1 .accent{background:var(--gold);} .kpi.c2 .accent{background:var(--red);}
.kpi.c3 .accent{background:var(--navy-700);} .kpi.c4 .accent{background:var(--green);}
.kpi.c5 .accent{background:#7C6CC4;}

.grid-2{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;margin-bottom:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.panel-head h3{font-size:14.5px;font-weight:700;}
.panel-head a{font-size:12px;color:var(--navy-700);text-decoration:none;font-weight:600;}
.chart-wrap{height:230px;position:relative;}

.alerts{display:flex;flex-direction:column;gap:9px;}
.alert{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;font-size:12.5px;}
.alert .a-ico{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;}
.alert.warn{background:var(--amber-bg);} .alert.warn .a-ico{background:#F3DFAE;color:var(--amber);}
.alert.danger{background:var(--red-bg);} .alert.danger .a-ico{background:#F2CAC7;color:var(--red);}
.alert b{display:block;font-weight:600;}
.alert span{color:var(--ink-soft);}

/* Tables */
.table-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.mini-search{display:flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--ink-soft);width:210px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.filters select, .filters input[type=date]{
  border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:12px;color:var(--ink-soft);background:var(--card);font-family:inherit;
}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:right;background:var(--paper);color:var(--ink-soft);font-weight:600;
  font-size:11.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFD;}
td.num-cell{font-weight:600;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
.pill.paid{background:var(--green-bg);color:var(--green);}
.pill.partial{background:var(--amber-bg);color:var(--amber);}
.pill.unpaid{background:var(--red-bg);color:var(--red);}
.pill.draft{background:#EDEFF3;color:var(--ink-soft);}
.pill.active{background:var(--green-bg);color:var(--green);}
.pill.pending{background:var(--amber-bg);color:var(--amber);}
.row-actions{display:flex;gap:6px;}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);}
.icon-btn:hover{background:var(--paper);color:var(--navy-900);}
.avatar-sm{width:28px;height:28px;border-radius:7px;background:var(--navy-800);color:var(--gold-soft);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-left:9px;}
.cell-name{display:flex;align-items:center;}
.cell-name .meta{font-size:11px;color:var(--ink-soft);display:block;}
.table-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;font-size:12px;color:var(--ink-soft);}
.pager{display:flex;gap:5px;}
.pager button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:inherit;font-size:11.5px;}
.pager button.on{background:var(--navy-900);color:#fff;border-color:var(--navy-900);}

/* Placeholder / settings blocks */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
.field input, .field select{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;background:var(--paper);
}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;display:flex;align-items:center;gap:6px;}
.chip .x{color:var(--ink-soft);cursor:pointer;}

.stub-note{
  display:flex;align-items:center;gap:10px;background:var(--gold-soft);color:#6B531E;
  border:1px solid #DDC48A;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;
}

.watermark{
  position:fixed;bottom:16px;left:16px;background:var(--navy-950);color:var(--gold-soft);
  font-size:11px;padding:7px 13px;border-radius:20px;z-index:20;font-family:'IBM Plex Mono';
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}

@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2, .grid-3{grid-template-columns:1fr;}
  .settings-grid{grid-template-columns:1fr;}
}
@media (max-width:760px){
  .sidebar{position:fixed;right:-260px;z-index:50;transition:right .2s;}
  .sidebar.open{right:0;}
  .search-box{display:none;}
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="brand-mark">TW</div>
    <div class="brand-text"><b>نُظم للمحاسبة</b><span>Werbetechnik &amp; Digitaldruck</span></div>
  </div>
  <nav class="nav" id="navList"></nav>
  <div class="sidebar-foot">نسخة عرض تجريبية · واجهة فقط v1.0</div>
</aside>

<main class="main">
  <div class="topbar">
    <div class="topbar-title" id="pageTitle">لوحة التحكم<span id="pageSub">نظرة عامة على الوضع المالي للشركة</span></div>
    <div class="topbar-right">
      <div class="search-box">🔍 بحث سريع في النظام…</div>
      <div class="tb-icon-btn">🔔<span class="dot"></span></div>
      <div class="tb-icon-btn">⚙️</div>
      <div class="user-chip">
        <div class="avatar">TA</div>
        <div class="u"><b>TAP Admin</b><span>مدير النظام</span></div>
      </div>
    </div>
  </div>

  <div class="content" id="content"></div>
</main>

<div class="watermark">ماكيت واجهة فقط — بدون ربط قاعدة بيانات</div>

<script>
/* ============== NAV CONFIG ============== */
const NAV = [
  {group:"عام", items:[
    {id:"dashboard", label:"لوحة التحكم", ico:"▦"},
  ]},
  {group:"الأطراف", items:[
    {id:"customers", label:"العملاء", ico:"◔", badge:"128"},
    {id:"suppliers", label:"الموردون", ico:"◑"},
  ]},
  {group:"المبيعات والمشتريات", items:[
    {id:"invoices", label:"المبيعات والفواتير", ico:"▤"},
    {id:"purchases", label:"المشتريات", ico:"▥"},
  ]},
  {group:"الخزينة", items:[
    {id:"receipts", label:"سندات القبض", ico:"↙"},
    {id:"payments", label:"سندات الصرف", ico:"↗"},
    {id:"expenses", label:"المصروفات", ico:"▽"},
    {id:"revenues", label:"الإيرادات", ico:"△"},
    {id:"accounts", label:"الصندوق والحسابات", ico:"▣"},
    {id:"banks", label:"البنوك والشيكات", ico:"▧", badge:"3"},
  ]},
  {group:"الموارد البشرية", items:[
    {id:"employees", label:"الموظفون والاستحقاقات", ico:"☺"},
  ]},
  {group:"السجلات والتقارير", items:[
    {id:"journal", label:"القيود والحركات المالية", ico:"≣"},
    {id:"reports", label:"التقارير", ico:"▨"},
  ]},
  {group:"إدارة النظام", items:[
    {id:"users", label:"المستخدمون والصلاحيات", ico:"⚿"},
    {id:"settings", label:"إعدادات النظام", ico:"⚙"},
  ]},
];

const TITLES = {
  dashboard:["لوحة التحكم","نظرة عامة على الوضع المالي للشركة"],
  customers:["العملاء","إدارة بيانات العملاء وأرصدتهم"],
  suppliers:["الموردون","إدارة بيانات الموردين وأرصدتهم"],
  invoices:["المبيعات والفواتير","إصدار ومتابعة فواتير العملاء"],
  purchases:["المشتريات","فواتير ومشتريات الموردين"],
  receipts:["سندات القبض","تسجيل المبالغ المقبوضة من العملاء"],
  payments:["سندات الصرف","تسجيل المبالغ المصروفة للموردين والمصاريف"],
  expenses:["المصروفات","تصنيف ومتابعة مصاريف الشركة"],
  revenues:["الإيرادات","الإيرادات الأخرى خارج فواتير المبيعات"],
  accounts:["الصندوق والحسابات","أرصدة الصناديق والحسابات المالية"],
  banks:["البنوك والشيكات","متابعة الحسابات البنكية والشيكات"],
  employees:["الموظفون والاستحقاقات","رواتب واستحقاقات فريق العمل"],
  journal:["القيود والحركات المالية","السجل المركزي لكل حركة محاسبية"],
  reports:["التقارير","تقارير مالية جاهزة للطباعة والتصدير"],
  users:["المستخدمون والصلاحيات","إدارة حسابات الدخول وصلاحياتها"],
  settings:["إعدادات النظام","بيانات الشركة وإعدادات الترقيم والطباعة"],
};

/* ============== RENDER SIDEBAR ============== */
const navList = document.getElementById('navList');
NAV.forEach(g=>{
  const gl = document.createElement('div');
  gl.className='nav-group-label'; gl.textContent=g.group;
  navList.appendChild(gl);
  g.items.forEach(it=>{
    const el = document.createElement('div');
    el.className='nav-item'+(it.id==='dashboard'?' active':'');
    el.dataset.id = it.id;
    el.innerHTML = `<span class="ico">${it.ico}</span><span>${it.label}</span>`+(it.badge?`<span class="badge">${it.badge}</span>`:'');
    el.onclick = ()=>go(it.id);
    navList.appendChild(el);
  });
});

function go(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.id===id));
  document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active', s.id==='sec-'+id));
  document.getElementById('pageTitle').innerHTML = TITLES[id][0]+`<span id="pageSub">${TITLES[id][1]}</span>`;
  window.scrollTo({top:0,behavior:'smooth'});
  if(id==='dashboard' && !window._chartsDone) setTimeout(initCharts,60);
}

/* ============== SAMPLE DATA ============== */
const money = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';

const customers = [
  ["C-1001","محمد الأحمد","شركة الأحمد للدعاية","0151 00000000","محمد@ahmad-werbung.de",12400,9800,2600,"نشط"],
  ["C-1002","سارة يوسف","مؤسسة النور التجارية","0151 00000000","sara@alnoor.de",8200,8200,0,"نشط"],
  ["C-1003","عمر خليل","مطعم البيت الدمشقي","0151 00000000","omar@beithome.de",3150,1500,1650,"نشط"],
  ["C-1004","لينا حداد","صالون لينا للتجميل","0151 00000000","lina@salon-lina.de",5600,2000,3600,"متأخر"],
  ["C-1005","Kevin Brandt","Brandt Bau GmbH","0151 00000000","k.brandt@brandtbau.de",21000,21000,0,"نشط"],
  ["C-1006","رامي فارس","سوبر ماركت الأمل","0151 00000000","rami@alamal-markt.de",1980,900,1080,"نشط"],
];

const suppliers = [
  ["S-201","مؤسسة الطباعة الحديثة","توريد مواد طباعة","0151 00000000","info@modernprint.de",6400,4400,2000,"نشط"],
  ["S-202","Flexo Materials GmbH","مواد فليكس وستيكرات","0151 00000000","sales@flexo-materials.de",15200,15200,0,"نشط"],
  ["S-203","شركة الأحبار الشرقية","أحبار وخامات طباعة","0151 00000000","orders@ostink.de",3800,1800,2000,"نشط"],
  ["S-204","LED Technik Vertrieb","إضاءات ولوحات LED","0151 00000000","kontakt@ledtechnik.de",9600,6000,3600,"نشط"],
];

const invoices = [
  ["INV-3051","09.09.2026","محمد الأحمد","لافتة إعلانية Banner 3×2م",2600,2600,0,"paid"],
  ["INV-3050","07.09.2026","Kevin Brandt","طباعة أفيشات + تركيب",4200,2200,2000,"partial"],
  ["INV-3049","05.09.2026","لينا حداد","ستيكرات واجهة المحل",1650,0,1650,"unpaid"],
  ["INV-3048","03.09.2026","رامي فارس","تصميم وطباعة كتالوج",1080,0,1080,"unpaid"],
  ["INV-3047","01.09.2026","سارة يوسف","لوحة إعلانية مضيئة LED",8200,8200,0,"paid"],
  ["INV-3046","29.08.2026","عمر خليل","قائمة طعام + رول أب",950,950,0,"paid"],
  ["INV-3045","27.08.2026","محمد الأحمد","مسودة عرض – قيد المراجعة",1200,0,1200,"draft"],
];

const receipts = [
  ["REC-880","09.09.2026","سارة يوسف","تحويل بنكي","INV-3047",8200,"البنك الرئيسي"],

/* ============== TABLE BUILDER ============== */
function pillFor(status){
  const map = {paid:["مدفوعة بالكامل","paid"], partial:["مدفوعة جزئياً","partial"], unpaid:["غير مدفوعة","unpaid"], draft:["مسودة","draft"],
    "نشط":["نشط","active"], "متأخر":["متأخر","unpaid"], "مستحق":["مستحق","pending"], "قيد الانتظار":["قيد الانتظار","pending"], "محصل":["محصل","paid"]};
  const m = map[status] || [status,"draft"];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}

function buildTable(mountId, cols, rows, rowRenderer){
  const el = document.getElementById(mountId);
  let html = '<table><thead><tr>';
  cols.forEach(c=> html += `<th>${c}</th>`);
  html += '<th>إجراءات</th></tr></thead><tbody>';
  rows.forEach(r=> html += rowRenderer(r));
  html += '</tbody></table>';
  el.innerHTML = html;
}
